<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sales Coach AI - Gravando</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100%; height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a; color: #e2e8f0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px;
    }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .header h1 { font-size: 15px; font-weight: 700; color: #60a5fa; }
    .recording-indicator { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .pulse { width: 12px; height: 12px; border-radius: 50%; background: #ef4444; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .timer { font-size: 36px; font-weight: 700; color: #f87171; margin: 12px 0; font-variant-numeric: tabular-nums; }
    .mode { font-size: 12px; color: #22c55e; margin-bottom: 16px; }
    .btn { padding: 10px 32px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; }
    .status { text-align: center; padding: 10px 16px; border-radius: 8px; font-size: 13px; margin-top: 12px; max-width: 380px; }
    .status.sending { background: #1e3a5f; color: #60a5fa; }
    .status.success { background: #14532d; color: #4ade80; }
    .status.error { background: #450a0a; color: #fca5a5; }
    .status.info { background: #1e293b; color: #94a3b8; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎯 Sales Coach AI</h1>
  </div>
  <div id="init-status" class="status info">🖥 Selecione a tela para compartilhar...</div>
  <div id="recording-view" class="hidden">
    <div class="recording-indicator">
      <div class="pulse"></div>
      <span>Gravando...</span>
    </div>
    <div class="timer" id="timer">00:00:00</div>
    <div class="mode" id="mode-label">🖥 Tela + 🎙 Áudio</div>
    <button class="btn btn-danger" id="btn-stop">⏹ Parar e Enviar</button>
  </div>
  <div id="status-msg" class="status hidden"></div>
  <script src="recorder.js"></script>
</body>
</html>
