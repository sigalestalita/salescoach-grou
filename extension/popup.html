<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Coach AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 360px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; }
    .container { padding: 16px; }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .header h1 { font-size: 16px; font-weight: 700; color: #60a5fa; }
    .header .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    .header .dot.offline { background: #ef4444; }
    .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .field label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    .field input, .field select { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 8px 10px; color: #e2e8f0; font-size: 13px; outline: none; }
    .field input:focus, .field select:focus { border-color: #60a5fa; }
    .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-bottom: 6px; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .recording-indicator { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 4px; }
    .pulse { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .timer { text-align: center; font-size: 28px; font-weight: 700; color: #f87171; margin: 8px 0; font-variant-numeric: tabular-nums; }
    .screen-status { text-align: center; font-size: 12px; color: #22c55e; margin-bottom: 8px; }
    .status { text-align: center; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 13px; }
    .status.sending { background: #1e3a5f; color: #60a5fa; }
    .status.success { background: #14532d; color: #4ade80; }
    .status.error { background: #450a0a; color: #fca5a5; }
    .separator { height: 1px; background: #334155; margin: 10px 0; }
    .logout-link { font-size: 11px; color: #64748b; text-align: center; cursor: pointer; }
    .logout-link:hover { color: #94a3b8; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎯 Sales Coach AI</h1>
      <div class="dot" id="status-dot"></div>
    </div>

    <!-- Login -->
    <div id="login-section">
      <h2 style="font-size:14px;color:#94a3b8;margin-bottom:12px;">Faça login para começar</h2>
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="seu@email.com">
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="login-password" placeholder="Sua senha">
      </div>
      <button class="btn btn-primary" id="btn-login">Entrar</button>
      <div id="login-error" class="status error hidden"></div>
    </div>

    <!-- Main -->
    <div id="recording-section" class="hidden">
      <!-- Form -->
      <div id="form-section">
        <div class="field">
          <label>Título da Agenda</label>
          <input type="text" id="meeting-title" placeholder="Ex: Reunião com Empresa X">
        </div>
        <div class="field">
          <label>Tipo</label>
          <select id="meeting-type"></select>
        </div>
        <div class="field">
          <label>Nome do Lead</label>
          <input type="text" id="lead-name" placeholder="Nome do contato">
        </div>
        <div class="field">
          <label>Empresa do Lead</label>
          <input type="text" id="lead-company" placeholder="Nome da empresa">
        </div>
        <div class="field">
          <label>Email do Lead</label>
          <input type="email" id="lead-email" placeholder="email@empresa.com">
        </div>
        <button class="btn btn-primary" id="btn-start">🎙 Iniciar Gravação (Tela + Áudio)</button>
      </div>

      <!-- Active recording -->
      <div id="active-recording" class="hidden">
        <div class="recording-indicator">
          <div class="pulse"></div>
          <span>Gravando...</span>
        </div>
        <div class="timer" id="timer">00:00:00</div>
        <div class="screen-status" id="screen-status">🖥 Tela + 🎙 Áudio</div>
        <button class="btn btn-danger" id="btn-stop">⏹ Parar e Enviar</button>
      </div>

      <!-- Status -->
      <div id="upload-status" class="hidden"></div>

      <div class="separator"></div>
      <div class="logout-link" id="btn-logout">Sair da conta</div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
