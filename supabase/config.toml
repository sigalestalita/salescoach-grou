project_id = "xgpfuunmmjkgwjefofcd"

# WebSocket: o token do usuário vem na query string e é validado dentro da
# própria função, junto com a checagem de organização.
[functions.live-transcribe]
verify_jwt = false

# Transcrição ao vivo da fala no modo de treino. O navegador não consegue
# mandar cabeçalho em WebSocket: o token vai na querystring e a função o valida.
[functions.roleplay-listen]
verify_jwt = false

# A função valida sozinha: aceita chamada interna (segredo compartilhado ou
# service role) ou usuário autenticado com acesso à reunião. Antes aceitava
# qualquer meetingId vindo de qualquer origem.
[functions.live-coach]
verify_jwt = false

# Link público de compartilhamento. A função exige share_enabled, validade e
# ausência de revogação.
[functions.get-shared-meeting]
verify_jwt = false

# Identidade visual resolvida antes do login, por subdomínio ou domínio
# próprio. Devolve uma organização por vez e nunca lista.
[functions.get-branding]
verify_jwt = false

# Formulário do site institucional. Público por natureza; a função tem
# campo-isca, validação e limite de envios por IP.
[functions.site-lead]
verify_jwt = false

# Volta do OAuth dos CRMs: o navegador chega sem token do Supabase. A função
# só aceita um "state" assinado por ela mesma, com validade de 15 minutos.
[functions.crm-oauth]
verify_jwt = false

# Fila de envio ao CRM. Aceita só chamada interna (segredo compartilhado ou
# service role), validada dentro da função.
[functions.crm-sync]
verify_jwt = false

# Agenda do vendedor. O GET é a volta do OAuth (vem do navegador, sem token do
# Supabase) e só aceita um "state" assinado; o POST valida o usuário na função.
[functions.calendar]
verify_jwt = false

# Login automático da extensão: exige o token do usuário logado no site.
[functions.extension-session]
verify_jwt = true

# Cópia do áudio em partes durante a reunião (extensão). Exige o token do
# vendedor dono da reunião.
[functions.recording-parts]
verify_jwt = true

# Novidades: o agendador (pg_cron) chama sem token de usuário; a função confere
# o segredo do agendador ou se é a administração da plataforma.
[functions.product-updates]
verify_jwt = false

# Descadastro do e-mail de novidades: quem clica não está logado (token assinado).
[functions.email-preferences]
verify_jwt = false

[functions.meeting-bot-webhook]
verify_jwt = false

# Robô de reunião. O agendador (pg_cron) chama sem token de usuário, com o
# segredo ROBO_CRON_SECRET; as outras ações validam o usuário em getCaller.
[functions.meeting-bot]
verify_jwt = false
